<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Farming Alive</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: sans-serif;
    color: #fff;
    background: linear-gradient(#4fc3f7 0%, #81d4fa 30%, #8bc34a 65%, #33691e 100%);
  }
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 10vh;
    transition: opacity .5s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }

  .sun-wrap {
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, #fff9c4 0%, #ffe082 60%, rgba(255,224,130,.3) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 60px 20px rgba(255, 235, 59, .5);
  }
  .icon { font-size: 100px; animation: sway 2s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .title {
    margin-top: 24px; font-size: 38px; font-weight: 900; letter-spacing: 2px;
    color: #fff176;
    text-shadow: 0 3px 0 #33691e, 0 6px 10px rgba(0,0,0,.4);
  }
  .tag { margin-top: 8px; font-size: 15px; letter-spacing: 3px; opacity: .95; }

  .bar-wrap { width: 70%; max-width: 320px; margin-top: 40px; position: relative; }
  .bar {
    height: 16px; border-radius: 10px; background: rgba(0,0,0,.25);
    overflow: hidden;
  }
  .fill {
    height: 100%; width: 0%; border-radius: 10px;
    background: repeating-linear-gradient(45deg, #76ff03 0 12px, #c6ff00 12px 24px);
    transition: width .2s linear;
  }
  .seed {
    position: absolute; top: -8px; left: 0%;
    font-size: 28px; transition: left .2s linear;
    transform: translateX(-50%);
  }
  .msg {
    margin-top: 28px; font-size: 15px; font-weight: bold; letter-spacing: 2px;
    text-shadow: 0 1px 4px rgba(0,0,0,.5);
  }

  .cloud { position: absolute; top: 6vh; font-size: 40px; opacity: .85; animation: drift 14s linear infinite; }
  .cloud.c2 { top: 16vh; font-size: 30px; animation-duration: 20s; animation-delay: -8s; }
  @keyframes drift { from { left: -15%; } to { left: 105%; } }

  #home {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    font-size: 22px; font-weight: bold; letter-spacing: 2px;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="cloud">☁️</div>
  <div class="cloud c2">☁️</div>

  <div class="sun-wrap"><div class="icon">🌾</div></div>
  <div class="title">FARMING ALIVE</div>
  <div class="tag">GROW · HARVEST · EARN</div>

  <div class="bar-wrap">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="seed" id="seed">🌱</div>
  </div>
  <div class="msg" id="msg">PREPARING THE FIELD...</div>
</div>

<div id="home">
  <div>🏠 HOME PAGE</div>
  <div style="font-size:14px;margin-top:8px;opacity:.8;font-weight:normal">(coming next)</div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  try {
    tg.setHeaderColor("#4fc3f7");
    tg.setBackgroundColor("#4fc3f7");
  } catch (e) {}

  const msgs = [
    "PREPARING THE FIELD...",
    "PLANTING SEEDS...",
    "WAKING THE CROPS...",
    "ALMOST READY!"
  ];
  const TOTAL = 2500;
  const start = Date.now();
  const fill = document.getElementById("fill");
  const seed = document.getElementById("seed");
  const msg = document.getElementById("msg");

  const timer = setInterval(() => {
    const p = Math.min(100, ((Date.now() - start) / TOTAL) * 100);
    fill.style.width = p + "%";
    seed.style.left = p + "%";
    msg.innerText = msgs[Math.min(msgs.length - 1, Math.floor(p / 26))];
    if (p >= 100) {
      clearInterval(timer);
      setTimeout(() => {
        document.getElementById("loading").classList.add("hide");
        document.getElementById("home").style.display = "flex";
      }, 300);
    }
  }, 50);
</script>
</body>
</html>
